name: Deploy games to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'GrandTheftData/**'
      - 'DataSwamp/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            GrandTheftData/package-lock.json
            DataSwamp/package-lock.json

      - name: Install Data Dash dependencies
        working-directory: GrandTheftData
        run: npm ci

      - name: Build Data Dash
        working-directory: GrandTheftData
        run: npm run build

      - name: Install Data Swamp dependencies
        working-directory: DataSwamp
        run: npm ci

      - name: Build Data Swamp
        working-directory: DataSwamp
        run: npm run build

      # Data Dash keeps the site root; Data Swamp is nested under /swamp/. Its Vite base is
      # './', so its asset URLs are relative and it does not care which subfolder it lands in.
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r GrandTheftData/dist/. site/
          mkdir -p site/swamp
          cp -r DataSwamp/dist/. site/swamp/
          echo "--- site tree ---"
          find site -maxdepth 2 -not -path '*/assets/*' | sort

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
