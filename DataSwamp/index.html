<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1512" />
    <title>Jerry vs the Prehistoric Data Swamp</title>
  </head>
  <body>
    <canvas id="game" aria-label="Data Swamp game canvas"></canvas>
    <div id="hurt" aria-hidden="true"></div>

    <header class="chrome top">
      <p class="mark">Jerry vs the <em>Data Swamp</em></p>
      <p class="stage">Milestone 3 — the arsenal</p>
    </header>

    <div id="over" role="status">
      <p class="verdict">Data loss</p>
      <p class="hint">Jerry has been comprehensively overwritten. <kbd>R</kbd> to restore from backup.</p>
    </div>

    <footer class="chrome bottom">
      <ul class="keys">
        <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</li>
        <li><span class="mouse">Mouse</span> aim</li>
        <li><span class="mouse">Click</span> throw</li>
        <li><kbd>Space</kbd> jump <span class="note">— clears ground shots</span></li>
        <li><kbd>1</kbd>–<kbd>4</kbd> <span class="mouse">Scroll</span> swap</li>
      </ul>

      <ol class="tiers" id="tiers" aria-label="Storage tiers"></ol>

      <div class="health" aria-label="Jerry's integrity">
        <span class="health-label">Integrity</span>
        <span class="health-track"><span class="health-fill" id="health-fill"></span></span>
      </div>
      <p class="readout" id="readout">—</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
