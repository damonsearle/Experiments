<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1512" />
    <title>Jerry vs the Prehistoric Data Swamp</title>
  </head>
  <body>
    <canvas id="game" aria-label="Data Swamp game canvas"></canvas>

    <header class="chrome top">
      <p class="mark">Jerry vs the <em>Data Swamp</em></p>
      <p class="stage">Milestone 0 — movement</p>
    </header>

    <footer class="chrome bottom">
      <ul class="keys">
        <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</li>
        <li><span class="mouse">Mouse</span> aim</li>
        <li><kbd>Space</kbd> jump</li>
      </ul>
      <p class="readout" id="readout">—</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
